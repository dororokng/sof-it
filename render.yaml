databases:
  - name: sofit-db
    plan: free
    databaseName: sofit
    user: sofit

services:
  - type: web
    name: sofit-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: >-
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run seed &&
      node scripts/create-admin.js "$ADMIN_EMAIL" "$ADMIN_PASSWORD"
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sofit-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_EMAIL
        value: admin@sofit.example
      - key: ADMIN_PASSWORD
        generateValue: true
