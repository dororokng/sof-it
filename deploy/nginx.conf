# Заготовка для боевого сервера (Nginx перед Node, оба на одной машине —
# см. CLAUDE.md, раздел про TRUST_PROXY: TRUST_PROXY=loopback на стороне
# Node). Для локальных честных замеров Lighthouse (аудит, шаг 3б) этот же
# файл запускается в Docker с самоподписанным сертификатом (deploy/certs/,
# не для продакшена — на боевом сервере сюда идёт настоящий сертификат,
# например от Let's Encrypt).
#
# Локальный запуск:
#   docker run --rm -d --name sofit-nginx --network host \
#     -v $(pwd)/deploy/nginx.conf:/etc/nginx/nginx.conf:ro \
#     -v $(pwd)/deploy/certs:/etc/nginx/certs:ro \
#     nginx:alpine
# (--network host — чтобы Nginx видел Node на 127.0.0.1:4000 так же, как
# увидел бы на боевом сервере с TRUST_PROXY=loopback)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    # Сжатие — тех типов, что ещё не сжаты своим форматом (WebP/JPEG и
    # шрифты .woff2 сюда специально не включены, см. CLAUDE.md).
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        location / {
            proxy_pass         http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }
    }
}
