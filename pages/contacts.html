<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Софит — Контакты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="header"></div>

  <main>
    <div class="page-hero wrap">
      <div class="breadcrumbs"><a href="/index.html">Главная</a> / Контакты</div>
      <h1 style="margin-top: 14px">Контакты</h1>
    </div>
    <section>
      <div class="wrap">
        <div class="contact-info-grid">
          <div class="contact-info-card"><span class="tag">Телефон</span><div class="val">+7 (000) 000-00-00</div></div>
          <div class="contact-info-card"><span class="tag">E-mail</span><div class="val">info@sofit.example</div></div>
          <div class="contact-info-card"><span class="tag">Адрес</span><div class="val">Уточняется</div></div>
        </div>
        <div class="section-head">
          <div>
            <span class="tag">Заявка</span>
            <h2 style="margin-top: 16px">Оставить заявку</h2>
          </div>
        </div>
        <form class="form-wrap" id="contactForm">
          <div class="field">
            <label for="f-name">Имя</label>
            <input id="f-name" type="text" required placeholder="Как к вам обращаться" />
          </div>
          <div class="field">
            <label for="f-company">Компания</label>
            <input id="f-company" type="text" placeholder="Название компании" />
          </div>
          <div class="field">
            <label for="f-phone">Телефон</label>
            <input id="f-phone" type="tel" required placeholder="+7 (___) ___-__-__" />
          </div>
          <div class="field">
            <label for="f-email">E-mail</label>
            <input id="f-email" type="email" placeholder="you@company.ru" />
          </div>
          <div class="field">
            <label for="f-comment">Комментарий</label>
            <textarea id="f-comment" placeholder="Кратко опишите задачу"></textarea>
          </div>
          <div class="field field-check">
            <input type="checkbox" id="f-consent" required />
            <label for="f-consent" style="margin: 0; text-transform: none; font-family: var(--body); font-size: 13px; letter-spacing: 0;">
              Согласен на обработку персональных данных
            </label>
          </div>
          <button type="submit" class="btn btn-primary">Отправить заявку</button>
          <div class="form-success" id="formSuccess">
            Заявка отправлена. Мы свяжемся с вами в ближайшее время.
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/js/include.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/contact-form.js"></script>
</body>
</html>
