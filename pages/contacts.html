<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Софит — Контакты</title>
  <meta name="description" content="Свяжитесь с компанией «Софит» — оставьте заявку на внедрение 1С или подбор роботизированного оборудования." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Софит — Контакты" />
  <meta property="og:description" content="Свяжитесь с компанией «Софит» — оставьте заявку на внедрение 1С или подбор роботизированного оборудования." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="canonical" href="https://sofit.example/pages/contacts.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="header"></div>

  <main>
    <div class="page-hero wrap">
      <div class="breadcrumbs"><a href="/index.html">Главная</a> / Контакты</div>
      <h1>Контакты</h1>
    </div>
    <section class="section-alt">
      <div class="wrap">
        <div class="contact-info-grid">
          <div class="contact-info-card"><span class="info-label">Телефон</span><div class="val" id="contactPhone">+7 (000) 000-00-00</div></div>
          <div class="contact-info-card"><span class="info-label">E-mail</span><div class="val" id="contactEmail">info@sofit.example</div></div>
          <div class="contact-info-card"><span class="info-label">Адрес</span><div class="val" id="contactAddress">Уточняется</div></div>
          <div class="contact-info-card"><span class="info-label">Часы работы</span><div class="val" id="contactHours">Пн–Пт, 9:00–18:00</div></div>
        </div>

        <div class="messenger-row section-gap">
          <a href="#" class="messenger-link" id="contactTelegram">Telegram</a>
          <a href="#" class="messenger-link" id="contactWhatsapp">WhatsApp</a>
          <a href="tel:+70000000000" class="messenger-link" id="contactCall">Позвонить</a>
        </div>

        <div class="section-head">
          <div>
            <h2>Оставить заявку</h2>
          </div>
        </div>
        <form class="form-wrap" id="contactForm">
          <div class="field">
            <label for="f-name">Имя</label>
            <input id="f-name" type="text" required placeholder="Как к вам обращаться" />
          </div>
          <div class="field">
            <label for="f-company">Компания</label>
            <input id="f-company" type="text" placeholder="Название компании" />
          </div>
          <div class="field">
            <label for="f-phone">Телефон</label>
            <input id="f-phone" type="tel" required placeholder="+7 (___) ___-__-__" />
          </div>
          <div class="field">
            <label for="f-email">E-mail</label>
            <input id="f-email" type="email" placeholder="you@company.ru" />
          </div>
          <div class="field">
            <label for="f-comment">Комментарий</label>
            <textarea id="f-comment" placeholder="Кратко опишите задачу"></textarea>
          </div>
          <div class="field field-honeypot" aria-hidden="true">
            <label for="f-website">Оставьте это поле пустым</label>
            <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <div class="field field-check">
            <input type="checkbox" id="f-consent" required />
            <label for="f-consent">
              Согласен на <a href="/pages/personal-data.html" target="_blank" rel="noopener">обработку персональных данных</a>
            </label>
          </div>
          <button type="submit" class="btn btn-primary">Отправить заявку</button>
          <div class="form-success" id="formSuccess">
            Заявка отправлена. Мы свяжемся с вами в ближайшее время.
          </div>
          <div class="form-error" id="formError"></div>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/js/data.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/contact-form.js"></script>
</body>
</html>
