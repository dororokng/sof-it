<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Софит — Новость</title>
  <meta name="description" content="Новость компании «Софит» — новости направлений IT/1С и роботизированного оборудования." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="header"></div>

  <main>
    <div class="page-hero wrap">
      <div class="breadcrumbs">
        <a href="/index.html">Главная</a> /
        <a href="/pages/news.html">Новости</a> /
        <span id="ndBreadcrumb"></span>
      </div>
      <span class="news-date" id="ndDate"></span>
      <h1 id="ndTitle"></h1>
    </div>
    <section class="tight">
      <div class="wrap article-wrap">
        <div class="news-thumb article-thumb bracket">
          <span class="bl"></span><span class="br"></span>
          <div class="grid-overlay"></div>
          <img id="ndImage" alt="" />
        </div>
        <div id="ndBody" class="article-body"></div>
      </div>
    </section>

    <!-- Текст — дословно из .cta-band на pages/otrasli.html (по просьбе:
         новый текст не придумывать). Сразу после тела статьи. -->
    <section class="cta-band">
      <div class="wrap cta-band-grid">
        <div>
          <h2>Не нашли свою отрасль?</h2>
          <p>Расскажите о своём бизнесе — подберём решение индивидуально.</p>
        </div>
        <a href="/pages/contacts.html" class="btn btn-primary btn-arrow">Заказать консультацию</a>
      </div>
    </section>

    <section class="tight">
      <div class="wrap">
        <div class="section-head">
          <div>
            <h2>Другие публикации</h2>
          </div>
        </div>
        <div class="news-grid" id="ndRelatedGrid"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/js/data.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/news-detail-page.js"></script>
</body>
</html>
