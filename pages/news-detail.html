<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Софит — Новость</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"

  />
  <link rel="stylesheet" href="/css/style.css" />

<body>

  <div id="header"></div>

  <main>
    <div class="page-hero wrap">

        <a href="/index.html">Главная</a> /
        <a href="/pages/news.html">Новости</a> /
        <span id="ndBreadcrumb"></span>
      </div>
      <span class="news-date" id="ndDate" style="margin-top: 16px; display: inline-block"></span>

    </div>
    <section class="tight">
      <div class="wrap" style="max-width: 760px">
        <div class="news-thumb bracket" style="margin-bottom: 36px">
          <span class="bl"></span><span class="br"></span>
          <div class="grid-overlay"></div>
        </div>
        <div id="ndBody" style="font-size: 16px; color: var(--ink-soft); line-height: 1.8"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/js/data.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/include.js"></script>
